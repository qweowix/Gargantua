# Ядро BlackHole для телефона: тот же поиск, импорт, тексты, главная и аккаунт, что на ПК.
# Модули не копии — подключаются из ../../src через #[path], так что правка в плеере сразу едет и сюда.
[package]
name = "blackhole-core"
version = "1.1.1"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
miniz_oxide = "0.8"
libc = "0.2"
jni = { version = "0.21", default-features = false }
# QR плейлистов — те же, что на ПК: один формат и один распознаватель
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
