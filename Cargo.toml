[package]
name = "blackhole"
version = "1.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/qweowix/Gargantua"

[dependencies]
slint = { version = "1", features = ["renderer-skia", "raw-window-handle-06"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
miniz_oxide = "0.8"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.22"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# только для тестов: снимки интерфейса без окна (src/shots.rs). В обычную сборку не попадает
[dev-dependencies]
slint = { version = "1", features = ["renderer-software", "software-renderer-systemfonts"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind" # паника в чужом фоновом потоке (D-Bus и т.п.) не должна валить весь плеер
