# Сборка под macOS по кнопке: Actions → macOS build → Run workflow. Готовый zip — в Artifacts.
# Один раннер собирает универсальный бинарь (Apple Silicon + Intel)
name: macOS build
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/build-macos.sh
        env:
          BLACKHOLE_FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          BLACKHOLE_FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          BLACKHOLE_FIREBASE_DB: ${{ secrets.FIREBASE_DB }}
      - uses: actions/upload-artifact@v4
        with:
          name: Gargantua-macos
          path: dist/Gargantua-macos.zip
